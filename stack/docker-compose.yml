name: torsync

services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: torsync-prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Dhaka
    volumes:
      - ./prowlarr/config:/config
    ports:
      - "9696:9696"
    restart: unless-stopped
    networks:
      - torsync

  # Cloudflare solver. FlareSolverr cannot clear TorrentBD's 2026 Managed
  # Challenge (it fails on TLS fingerprinting, not cookies), so we run Byparr,
  # which drives a real Camoufox browser and speaks the same API on port 8191.
  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: torsync-byparr
    environment:
      - TZ=Asia/Dhaka
    ports:
      - "8191:8191"
    shm_size: 2gb
    restart: unless-stopped
    networks:
      - torsync

networks:
  torsync:
    name: torsync
